services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"

  api-1:
    build:
      context: .
      args:
        BUILD_HNSW: ${BUILD_HNSW:-false}
        BUILD_IVF: ${BUILD_IVF:-false}
        IVF_NLIST: ${IVF_NLIST:-1024}
        IVF_SQ8: ${IVF_SQ8:-true}
        BUILD_VAMANA: ${BUILD_VAMANA:-false}
        VAMANA_R: ${VAMANA_R:-16}
        VAMANA_BUILD_L: ${VAMANA_BUILD_L:-0}
        VAMANA_ALPHA: ${VAMANA_ALPHA:-1.2}
        VAMANA_SQ8: ${VAMANA_SQ8:-true}
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-brute}
      - IVF_NPROBE=${IVF_NPROBE:-32}
      - VAMANA_L=${VAMANA_L:-64}
      - GOMEMLIMIT=140MiB
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api-2:
    build:
      context: .
      args:
        BUILD_HNSW: ${BUILD_HNSW:-false}
        BUILD_IVF: ${BUILD_IVF:-false}
        IVF_NLIST: ${IVF_NLIST:-1024}
        IVF_SQ8: ${IVF_SQ8:-true}
        BUILD_VAMANA: ${BUILD_VAMANA:-false}
        VAMANA_R: ${VAMANA_R:-16}
        VAMANA_BUILD_L: ${VAMANA_BUILD_L:-0}
        VAMANA_ALPHA: ${VAMANA_ALPHA:-1.2}
        VAMANA_SQ8: ${VAMANA_SQ8:-true}
    platform: linux/amd64
    ports:
      - "8081:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-brute}
      - IVF_NPROBE=${IVF_NPROBE:-32}
      - VAMANA_L=${VAMANA_L:-64}
      - GOMEMLIMIT=140MiB
      - GOMAXPROCS=1
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  api-network:
    driver: bridge

