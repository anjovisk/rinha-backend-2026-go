services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"

  api-1:
    build: .
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api-2:
    build: .
    platform: linux/amd64
    ports:
      - "8081:8080"
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

networks:
  api-network:
    driver: bridge

