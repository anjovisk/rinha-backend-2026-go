services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.30"
          memory: "50MB"

  api-1:
    build:
      context: .
      args:
        VECTOR_SEARCHER: ${VECTOR_SEARCHER:-hnswflat}
        BUILD_HNSW: ${BUILD_HNSW:-false}
        BUILD_IVF: ${BUILD_IVF:-false}
        IVF_NLIST: ${IVF_NLIST:-1024}
        IVF_SQ8: ${IVF_SQ8:-true}
        BUILD_VAMANA: ${BUILD_VAMANA:-false}
        VAMANA_R: ${VAMANA_R:-16}
        VAMANA_BUILD_L: ${VAMANA_BUILD_L:-0}
        VAMANA_ALPHA: ${VAMANA_ALPHA:-1.2}
        VAMANA_SQ8: ${VAMANA_SQ8:-true}
        BUILD_HNSWFLAT: ${BUILD_HNSWFLAT:-true}
        HNSWFLAT_M: ${HNSWFLAT_M:-3}
        HNSWFLAT_M0: ${HNSWFLAT_M0:-0}
        HNSWFLAT_EF_BUILD: ${HNSWFLAT_EF_BUILD:-100}
        HNSWFLAT_REFINE: ${HNSWFLAT_REFINE:-true}
        HNSWFLAT_SQ8: ${HNSWFLAT_SQ8:-true}
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-hnswflat}
      - IVF_NPROBE=${IVF_NPROBE:-32}
      - VAMANA_L=${VAMANA_L:-64}
      - HNSWFLAT_EF=${HNSWFLAT_EF:-50}
      - GOMEMLIMIT=${GOMEMLIMIT:-135MiB}
      - GOMAXPROCS=1
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-references}
      - QDRANT_EXACT=${QDRANT_EXACT:-false}
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "150MB"

  api-2:
    build:
      context: .
      args:
        VECTOR_SEARCHER: ${VECTOR_SEARCHER:-hnswflat}
        BUILD_HNSW: ${BUILD_HNSW:-false}
        BUILD_IVF: ${BUILD_IVF:-false}
        IVF_NLIST: ${IVF_NLIST:-1024}
        IVF_SQ8: ${IVF_SQ8:-true}
        BUILD_VAMANA: ${BUILD_VAMANA:-false}
        VAMANA_R: ${VAMANA_R:-16}
        VAMANA_BUILD_L: ${VAMANA_BUILD_L:-0}
        VAMANA_ALPHA: ${VAMANA_ALPHA:-1.2}
        VAMANA_SQ8: ${VAMANA_SQ8:-true}
        BUILD_HNSWFLAT: ${BUILD_HNSWFLAT:-true}
        HNSWFLAT_M: ${HNSWFLAT_M:-3}
        HNSWFLAT_M0: ${HNSWFLAT_M0:-0}
        HNSWFLAT_EF_BUILD: ${HNSWFLAT_EF_BUILD:-100}
        HNSWFLAT_REFINE: ${HNSWFLAT_REFINE:-true}
        HNSWFLAT_SQ8: ${HNSWFLAT_SQ8:-true}
    platform: linux/amd64
    ports:
      - "8081:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-error}
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-hnswflat}
      - IVF_NPROBE=${IVF_NPROBE:-32}
      - VAMANA_L=${VAMANA_L:-64}
      - HNSWFLAT_EF=${HNSWFLAT_EF:-50}
      - GOMEMLIMIT=${GOMEMLIMIT:-135MiB}
      - GOMAXPROCS=1
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-references}
      - QDRANT_EXACT=${QDRANT_EXACT:-false}
    depends_on:
      qdrant:
        condition: service_healthy
        required: false
    deploy:
      resources:
        limits:
          cpus: "0.35"
          memory: "150MB"

  # ── qdrant ────────────────────────────────────────────────────────────────────
  # Ativo apenas com: docker compose --profile qdrant up
  # Vetores de referência são inseridos na primeira inicialização das APIs e
  # persistidos em qdrant_storage. Reinicializações subsequentes saltam a carga.
  #
  # Orçamento alternativo com VECTOR_SEARCHER=qdrant (total 1 CPU / 350 MB):
  #   nginx  0.10 CPU  20 MB
  #   qdrant 0.50 CPU 270 MB  (HNSW + quantização int8 ~250 MB para 3M vetores × 14 dims)
  #   api-1  0.20 CPU  30 MB  (sem índice local — só HTTP + vetorização)
  #   api-2  0.20 CPU  30 MB
  qdrant:
    image: qdrant/qdrant:latest
    platform: linux/amd64
    profiles: ["qdrant"]
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - api-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: "270MB"

networks:
  api-network:
    driver: bridge

volumes:
  qdrant_storage:

# Totais padrão (hnswflat): 1.0 CPU | 350 MB
# Totais com --profile qdrant: 1.0 CPU | 350 MB
