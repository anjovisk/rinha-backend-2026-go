services:
  nginx:
    image: nginx:alpine
    platform: linux/amd64
    ports:
      - "9999:9999"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-1
      - api-2
    networks:
      - api-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "20MB"

  api-1:
    build:
      context: .
      args:
        BUILD_HNSW: ${BUILD_HNSW:-false}
    platform: linux/amd64
    ports:
      - "8080:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=error
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-brute}
    deploy:
      resources:
        limits:
          cpus: "2.45"
          memory: "3665MB"

  api-2:
    build:
      context: .
      args:
        BUILD_HNSW: ${BUILD_HNSW:-false}
    platform: linux/amd64
    ports:
      - "8081:8080"
    networks:
      - api-network
    restart: unless-stopped
    environment:
      - LOG_LEVEL=error
      - VECTOR_SEARCHER=${VECTOR_SEARCHER:-brute}
    deploy:
      resources:
        limits:
          cpus: "2.45"
          memory: "3665MB"

networks:
  api-network:
    driver: bridge

